<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Travel</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-slate-950 text-white font-body p-8">
    <main class="max-w-7xl min-h-dvh bg-white/5 rounded-3xl p-4 mx-auto border border-white/15">
        <header class="flex flex-col items-center justify-between gap-4 lg:flex-row">
            <h1 class="font-title text-4xl font-bold leading-tight md:text-5xl">Space Travel</h1>
            <figure class="flex gap-1">
                <img src="./images/astro01.jpg" alt="Astronauta 1"
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro02.jpg" alt="Astronauta 2" duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro03.jpg" alt="Astronauta 3n" duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro04.jpg" alt="Astronauta 4n" duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro05.jpg" alt="Astronauta 5n" duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro06.jpg" alt="Astronauta 6n" duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro07.jpg" alt="Astronauta 7n" duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
                <img src="./images/astro08.jpg" alt="Astronauta 8n" duration-500
                class="size-10 rounded-full border-2 border-cyan-950 object-cover cursor-pointer hover:animate-spin duration-500">
            </figure>
        </header>

        <form name="form-viagem" id="form-viagem"  method="get" action="">
            <p class="my-5 font-medium text-cyan-300 text-center text-balance lg:text-left">
                Preencha os dados abaixo para confirmar sua viagem espacial
            </p>

            <fieldset class="border border-white/10 rounded-2xl bg-white/10 p-4">
                <legend class="font-title text-lg font-bold  text-cyan-300 px-2">01. Dados do viajante</legend>

                <section class="grid gap-6 md:grid-cols-2">

                    <div>
                        <label for="nome" class=" block ml-2 text-sm mb-2 text-slate-300">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="10" maxlength="30" class="border border-white/10 bg-slate-900/60 px-2 py-3 w-full rounded-lg outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                    <div>
                        <label for="cogigo" class=" block ml-2 text-sm mb-2 text-slate-300">Código de acesso</label>
                        <input type="text" id="cogigo" name="cogigo" placeholder="Digite código" required minlength="10" maxlength="30"
                            class="border border-white/10 bg-slate-900/60 px-2 py-3 w-full rounded-lg outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                    <div>
                        <label for="data" class=" block ml-2 text-sm mb-2 text-slate-300">Data da viajem</label>
                        <input type="text" id="data" name="data" placeholder="dd/mm/aaaa" required minlength="10" maxlength="30"
                            class="border border-white/10 bg-slate-900/60 px-2 py-3 w-full rounded-lg outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>
                    <div>
                        <label for="email" class=" block ml-2 text-sm mb-2 text-slate-300">Digite seu e-mail</label>
                        <input type="text" id="email" name="email" placeholder="Digite seu e-mail" required minlength="10" maxlength="30"
                            class="border border-white/10 bg-slate-900/60 px-2 py-3 w-full rounded-lg outline-none focus:border-cyan-400 focus:bg-white/10">
                    </div>


                </section>
            </fieldset>
        </form>
    </main>
</body>
</html>
